version: "3.9"

services:
  db:
    image: postgres:15
    container_name: cejei_db
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cejei_licencias}
      POSTGRES_USER: ${POSTGRES_USER:-cejei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cejei}
    ports:
      - "${DB_PORT:-5532}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cejei} -d ${POSTGRES_DB:-cejei_licencias}"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    container_name: cejei_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: cejei_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-development}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,192.168.184.175,0.0.0.0}
      DJANGO_COLLECTSTATIC: ${DJANGO_COLLECTSTATIC:-true}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      # Transición: por defecto usa media del host para evitar 404 en adjuntos históricos.
      # Para volver a volumen Docker: define MEDIA_MOUNT_SOURCE=media_data en .env.
      - ${MEDIA_MOUNT_SOURCE:-../media}:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8000"
    command: ["/bin/bash", "docker/entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/accounts/login/', timeout=5)\" >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: cejei_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-development}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_NAME: ${WORKER_NAME:-docker-worker}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-10}
      WORKER_RUN_LIMIT: ${WORKER_RUN_LIMIT:-50}
      WORKER_SCHEDULE_LIMIT: ${WORKER_SCHEDULE_LIMIT:-100}
    volumes:
      - ${MEDIA_MOUNT_SOURCE:-../media}:/app/media
      - static_data:/app/staticfiles
    command: ["/bin/bash", "docker/worker.sh"]

  nginx:
    image: nginx:1.27-alpine
    container_name: cejei_nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8080}:80"
      - "${NGINX_PORT_LEGACY:-8000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${MEDIA_MOUNT_SOURCE:-../media}:/var/www/media:ro
      - static_data:/var/www/static:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  media_data:
  static_data:
