<div class="module-panel__header">
    <h3 class="module-panel__title">Editar trabajador</h3>
    <p class="module-panel__subtitle">{{ empleado.nombre }}</p>
</div>
<form method="post" action="{% url 'tramites:empleado-picker-edit' empleado.pk %}" data-empleado-picker-form>
    {% csrf_token %}
    <div class="form-grid">
        <div class="form-field">
            <label for="{{ form.nombre.id_for_label }}">Nombre del trabajador</label>
            {{ form.nombre }}
        </div>
        <div class="form-field">
            <label for="{{ form.rfc.id_for_label }}">RFC</label>
            {{ form.rfc }}
        </div>
        <div class="form-field">
            <label for="{{ form.curp.id_for_label }}">CURP</label>
            {{ form.curp }}
        </div>
        <div class="form-field">
            <label for="{{ form.correo.id_for_label }}">Correo</label>
            {{ form.correo }}
        </div>
        <div class="form-field">
            <label for="{{ form.telefono.id_for_label }}">Teléfono</label>
            {{ form.telefono }}
        </div>
        <div class="form-field">
            <label for="{{ form.celular.id_for_label }}">Celular</label>
            {{ form.celular }}
        </div>
        <div class="form-field">
            <label for="{{ form.direccion.id_for_label }}">Dirección</label>
            {{ form.direccion }}
        </div>
        <div class="form-field">
            <label for="{{ form.colonia.id_for_label }}">Colonia</label>
            {{ form.colonia }}
        </div>
        <div class="form-field">
            <label for="{{ form.codigo_postal.id_for_label }}">Código postal</label>
            {{ form.codigo_postal }}
        </div>
    </div>
    <div class="module-panel__footer">
        <button type="submit" class="btn btn--primary btn--md">Guardar cambios</button>
        <button type="button" class="btn btn--ghost btn--md" data-empleado-picker-back>Volver</button>
    </div>
</form>
